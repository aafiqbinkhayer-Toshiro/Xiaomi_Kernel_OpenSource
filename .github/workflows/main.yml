name: Build Gram Kernel (Stock AOSP Clang r353983c)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Dependencies & Python 2
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev zip ca-certificates curl git make python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Stock Clang r353983c & GCC 4.9 (Google Official Git)
        run: |
          # AOSP Clang (android10-release ব্রাঞ্চে Clang r353983c অন্তর্ভুক্ত থাকে)
          git clone --depth=1 -b android10-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $HOME/clang-repo
          
          # AOSP GCC 4.9 (অ্যাসেম্বলার এবং লিংকারের জন্য)
          git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/gcc-64
          git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/gcc-32

      - name: Clone Gram Kernel Source
        run: |
          git clone --depth=1 -b gram-q-oss https://github.com/aafiqbinkhayer-Toshiro/Xiaomi_Kernel_OpenSource.git $HOME/kernel

      - name: Compile Kernel
        run: |
          cd $HOME/kernel
          
          # Clang r353983c এবং GCC এর পাথ সেট করা
          export PATH="$HOME/clang-repo/clang-r353983c/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"
          
          # বিল্ড আর্গুমেন্ট
          MAKE_PARAMS="ARCH=arm64 \
                       CC=clang \
                       CLANG_TRIPLE=aarch64-linux-gnu- \
                       CROSS_COMPILE=aarch64-linux-android- \
                       CROSS_COMPILE_ARM32=arm-linux-androideabi-"

          # 1. Defconfig তৈরি
          make -j$(nproc) O=out $MAKE_PARAMS vendor/atoll-perf_defconfig
          
          # 2. সম্পূর্ণ কার্নেল কম্পাইলেশন
          make -j$(nproc) O=out $MAKE_PARAMS KCFLAGS="-Wno-error" all

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AK3
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "Image*" -exec cp {} $HOME/AK3/ \;
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "dtbo.img" -exec cp {} $HOME/AK3/ \; || true
          
          cd $HOME/AK3
          sed -i 's/device.name1=.*/device.name1=gram/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=miatoll/g' anykernel.sh
          zip -r9 $HOME/gram-kernel-r353983c.zip * -x .git README.md

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Gram-Q-OSS-Kernel
          path: /home/runner/gram-kernel-r353983c.zip
