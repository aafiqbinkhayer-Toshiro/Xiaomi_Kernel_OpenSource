name: CI - Gram Kernel Build (gram-q-oss)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/aafiqbinkhayer-Toshiro/Xiaomi_Kernel_OpenSource
          branch: gram-q-oss
          config: vendor/atoll-perf_defconfig
          arch: arm64
          aosp-gcc: true
          android-version: "11"
          anykernel3: true
          other-clang-url: https://github.com/kdrag0n/proton-clang
          other-clang-branch: 20210522
          ccache: true
          ksu: true
          ksu-version: v0.9.3
