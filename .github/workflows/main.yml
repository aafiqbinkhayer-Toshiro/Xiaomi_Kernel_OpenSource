name: Build Gram Kernel (Proton Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev zip ca-certificates curl git make \
            python3 python-is-python3 build-essential cpio gawk device-tree-compiler libncurses5-dev \
            libncursesw5-dev xz-utils libtfm-dev

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang

      - name: Clone Gram Kernel Source
        run: |
          git clone --depth=1 -b gram-q-oss https://github.com/aafiqbinkhayer-Toshiro/Xiaomi_Kernel_OpenSource.git $HOME/kernel

      - name: Build Kernel
        run: |
          cd $HOME/kernel
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Defconfig তৈরি (Xiaomi SM6250 এর জন্য vendor/atoll-perf_defconfig বা vendor/atoll_defconfig)
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- vendor/atoll-perf_defconfig
          
          # কার্নেল কম্পাইলেশন (KCFLAGS দিয়ে ওয়ার্নিং স্কিপ করা হয়েছে)
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-unused-variable" \
            all

      - name: Verify Built Images
        run: |
          echo "Checking built files in out directory..."
          ls -la $HOME/kernel/out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AK3
          
          # Image / Image.gz-dtb এবং dtbo কপি
          find $HOME/kernel/out/arch/arm64/boot/ -name "Image*" -exec cp {} $HOME/AK3/ \;
          find $HOME/kernel/out/arch/arm64/boot/ -name "dtbo.img" -exec cp {} $HOME/AK3/ \; || true
          find $HOME/kernel/out/arch/arm64/boot/ -name "*.dtb" -exec cp {} $HOME/AK3/dtb \; || true
          
          cd $HOME/AK3
          sed -i 's/device.name1=.*/device.name1=gram/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=miatoll/g' anykernel.sh
          zip -r9 $HOME/gram-kernel.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Gram-Kernel-SM6250
          path: /home/runner/gram-kernel.zip
