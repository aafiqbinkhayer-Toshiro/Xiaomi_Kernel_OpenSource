name: Build Gram Kernel (Android 12 Clang)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Dependencies & Python 2
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev zip ca-certificates curl git make python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Android 12 Toolchains (Clang & GCC 4.9)
        run: |
          # Android 12 অফিসিয়াল Clang (clang-r416183b)
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $HOME/clang-repo
          
          # Android 12 GCC 4.9 (অ্যাসেম্বলার এবং 32/64-bit লিংকার)
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/gcc-64
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/gcc-32

      - name: Clone Gram Kernel Source
        run: |
          git clone --depth=1 -b gram-q-oss https://github.com/aafiqbinkhayer-Toshiro/Xiaomi_Kernel_OpenSource.git $HOME/kernel

      - name: Compile Kernel
        run: |
          cd $HOME/kernel
          
          # 1. dtc multiple definition of 'yylloc' এর স্থায়ী ফিক্স
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 2. Android 12 Clang পাথ লোড করা
          CLANG_PATH=$(find $HOME/clang-repo -maxdepth 1 -type d -name "clang-r*" | head -n 1)
          export PATH="$CLANG_PATH/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"
          
          # 3. বিল্ড প্যারামিটার (HOSTCFLAGS এ -fcommon দিয়ে হোস্ট GCC ফিক্স নিশ্চিত করা)
          MAKE_PARAMS="ARCH=arm64 \
                       CC=clang \
                       CLANG_TRIPLE=aarch64-linux-gnu- \
                       CROSS_COMPILE=aarch64-linux-android- \
                       CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                       HOSTCFLAGS=-fcommon \
                       HOSTCXXFLAGS=-fcommon"

          # 4. Defconfig তৈরি
          make -j$(nproc) O=out $MAKE_PARAMS vendor/atoll-perf_defconfig
          
          # 5. কার্নেল কম্পাইলেশন
          make -j$(nproc) O=out $MAKE_PARAMS KCFLAGS="-Wno-error" all

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AK3
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "Image*" -exec cp {} $HOME/AK3/ \;
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "dtbo.img" -exec cp {} $HOME/AK3/ \; || true
          
          cd $HOME/AK3
          sed -i 's/device.name1=.*/device.name1=gram/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=miatoll/g' anykernel.sh
          zip -r9 $HOME/gram-kernel-android12.zip * -x .git README.md

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Gram-Android12-Kernel
          path: /home/runner/gram-kernel-android12.zip
