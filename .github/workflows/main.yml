- name: Compile Kernel
        run: |
          cd $HOME/kernel
          
          # 1. dtc multiple definition of 'yylloc' ফিক্স
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          
          # 2. ড্রাইভার ও টেকপ্যাক থেকে হার্ডকোডেড -Werror মুছে ফেলা
          find drivers/ techpack/ -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror//g' {} + || true
          
          # 3. Android 12 Clang পাথ লোড করা
          CLANG_DIR=$(find $HOME/clang-repo -maxdepth 1 -type d -name "clang-r*" | sort -V | tail -n 1)
          export PATH="$CLANG_DIR/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"
          
          # 4. বিল্ড প্যারামিটার
          MAKE_PARAMS="ARCH=arm64 \
                       CC=clang \
                       CLANG_TRIPLE=aarch64-linux-gnu- \
                       CROSS_COMPILE=aarch64-linux-android- \
                       CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                       HOSTCFLAGS=-fcommon \
                       HOSTCXXFLAGS=-fcommon"

          # 5. Defconfig তৈরি
          make -j$(nproc) O=out $MAKE_PARAMS vendor/atoll-perf_defconfig
          
          # 6. কার্নেল কম্পাইলেশন এবং এরর ক্যাপচার
          make -j$(nproc) O=out $MAKE_PARAMS KCFLAGS="-Wno-error" all 2>&1 | tee build_log.txt || {
            echo "====================== REAL ERROR SUMMARY ======================"
            grep -inE "error:|fatal error:|undefined reference" build_log.txt | tail -n 25
            exit 1
          }
