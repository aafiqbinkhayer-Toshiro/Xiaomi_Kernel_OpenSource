name: Minimal Gram Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Environment
        run: |
          sudo apt update -y && sudo apt install -y bc bison flex libssl-dev libelf-dev zip
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang
          git clone --depth=1 -b gram-q-oss https://github.com/aafiqbinkhayer-Toshiro/Xiaomi_Kernel_OpenSource.git $HOME/kernel

      - name: Build Kernel
        run: |
          cd $HOME/kernel
          export PATH="$HOME/clang/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 vendor/atoll-perf_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            all

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AK3
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "Image*" -exec cp {} $HOME/AK3/ \;
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "dtbo.img" -exec cp {} $HOME/AK3/ \; || true
          cd $HOME/AK3 && zip -r9 $HOME/gram-kernel.zip * -x .git README.md

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Gram-Kernel-SM6250
          path: /home/runner/gram-kernel.zip
          access-token: ${{ secrets.GITHUB_TOKEN }}
