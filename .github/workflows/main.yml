name: Build Gram Kernel (Stock Clang r353983c)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Dependencies & Python 2
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev zip ca-certificates curl git make python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Stock Toolchains (GitHub Mirror - Fast & No 503 Error)
        run: |
          # Xiaomi gram-q-oss এর অফিশিয়াল Clang r353983c
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r353983c.git $HOME/clang
          
          # GCC 4.9 (lineage-17.1 ব্রাঞ্চে সম্পূর্ণ কম্পাইলার এবং ARM64 অ্যাসেম্বলার অন্তর্ভুক্ত)
          git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $HOME/gcc-64
          git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $HOME/gcc-32

      - name: Clone Gram Kernel Source
        run: |
          git clone --depth=1 -b gram-q-oss https://github.com/aafiqbinkhayer-Toshiro/Xiaomi_Kernel_OpenSource.git $HOME/kernel

      - name: Compile Kernel
        run: |
          cd $HOME/kernel
          export PATH="$HOME/clang/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"
          
          # গুরুত্বপূর্ণ: Defconfig এবং Build উভয় কমান্ডেই হুবহু একই ফ্ল্যাগ দিতে হবে
          MAKE_PARAMS="ARCH=arm64 \
                       CC=clang \
                       CLANG_TRIPLE=aarch64-linux-gnu- \
                       CROSS_COMPILE=aarch64-linux-android- \
                       CROSS_COMPILE_ARM32=arm-linux-androideabi-"

          # 1. Defconfig তৈরি (ARM64 চেকিং সহ)
          make -j$(nproc) O=out $MAKE_PARAMS vendor/atoll-perf_defconfig
          
          # 2. সম্পূর্ণ কার্নেল কম্পাইলেশন
          make -j$(nproc) O=out $MAKE_PARAMS all

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AK3
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "Image*" -exec cp {} $HOME/AK3/ \;
          find $HOME/kernel/out/arch/arm64/boot/ -maxdepth 1 -name "dtbo.img" -exec cp {} $HOME/AK3/ \; || true
          
          cd $HOME/AK3
          sed -i 's/device.name1=.*/device.name1=gram/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=miatoll/g' anykernel.sh
          zip -r9 $HOME/gram-kernel-r353983c.zip * -x .git README.md

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Gram-Q-OSS-Kernel
          path: /home/runner/gram-kernel-r353983c.zip
